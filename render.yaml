databases:
  - name: rallyvision-db
    databaseName: rallyvision
    user: rallyvision

services:
  # Backend FastAPI Web Service
  - type: web
    name: rallyvision-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_UPLOAD_SIZE_MB
        value: 250
      - key: DATABASE_URL
        fromDatabase:
          name: rallyvision-db
          property: connectionString

  # Frontend React Static Site
  - type: web
    name: rallyvision-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://rallyvision-backend.onrender.com/api/*
      - type: rewrite
        source: /storage/*
        destination: https://rallyvision-backend.onrender.com/storage/*
      - type: rewrite
        source: /*
        destination: /index.html

