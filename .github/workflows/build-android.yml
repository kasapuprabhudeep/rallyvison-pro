name: Build Android Play Store App Bundle & APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Play Store Bundle (AAB) & Instant-Install APK
        working-directory: frontend/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew bundleRelease assembleDebug --no-daemon

      - name: Upload Play Store AAB Bundle (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: rallyvision-pro-playstore-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Instant-Install Test APK (For Direct Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: rallyvision-pro-phone-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
