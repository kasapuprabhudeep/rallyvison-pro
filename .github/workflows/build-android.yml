name: Build Android Play Store App Bundle & APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Configure Android SDK Location and Ensure Platform 35
        working-directory: frontend/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build Android Play Store Bundle (AAB) & Instant-Install APK
        working-directory: frontend/android
        run: |
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload Gradle Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: frontend/android/gradle-build.log

      - name: Upload Play Store AAB Bundle (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: rallyvision-pro-playstore-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Instant-Install Test APK (For Direct Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: rallyvision-pro-phone-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
