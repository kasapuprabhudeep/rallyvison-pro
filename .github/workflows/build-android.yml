name: Build Android Play Store App Bundle & APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Configure Android SDK Location and Install Platform 35
        working-directory: frontend/android
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKMANAGER=$(which sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER --install "platforms;android-35" "platforms;android-34" "build-tools;35.0.0"

      - name: Build Instant-Install Test APK
        working-directory: frontend/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Play Store App Bundle (AAB)
        working-directory: frontend/android
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Play Store AAB Bundle (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: rallyvision-pro-playstore-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Instant-Install Test APK (For Direct Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: rallyvision-pro-phone-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
