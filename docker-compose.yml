version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rallyvision_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=rallyvision-production-secret-key-2026
      - DATABASE_URL=sqlite:////app/data/rallyvision.db
      - MAX_UPLOAD_SIZE_MB=250
    volumes:
      - ./storage:/app/storage
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rallyvision_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data:

